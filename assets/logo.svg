<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title>Build Android App — Android head + build stack + Play badge</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#0EA05A"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#g)"/>
  <!-- centered Android head + build foundation -->
  <g transform="translate(64 56)">
    <!-- antenna stems -->
    <rect x="-16.5" y="-31" width="3.2" height="11" rx="1.6" fill="white" transform="rotate(-18 -16.5 -31)"/>
    <rect x="13.3" y="-31" width="3.2" height="11" rx="1.6" fill="white" transform="rotate(18 13.3 -31)"/>
    <circle cx="-19.2" cy="-33.2" r="3.4" fill="white"/>
    <circle cx="16" cy="-33.2" r="3.4" fill="white"/>
    <!-- head -->
    <rect x="-28" y="-20" width="56" height="34" rx="13" fill="white"/>
    <!-- eyes -->
    <circle cx="-11" cy="-4.5" r="3.6" fill="#0F172A"/>
    <circle cx="11" cy="-4.5" r="3.6" fill="#0F172A"/>
    <!-- subtle smile -->
    <rect x="-7" y="6" width="14" height="2.4" rx="1.2" fill="#0F172A" opacity="0.12"/>
    <!-- build foundation = two layers under head -->
    <rect x="-22" y="17.5" width="44" height="6.5" rx="3.2" fill="white"/>
    <rect x="-22" y="26.5" width="44" height="6.5" rx="3.2" fill="white" opacity="0.78"/>
  </g>
  <!-- Play badge -->
  <g transform="translate(101 101)">
    <circle cx="0" cy="0" r="17.5" fill="white"/>
    <path d="M -5.5 -7.5 L 9 0 L -5.5 7.5 Z" fill="#0F172A"/>
  </g>
</svg>
