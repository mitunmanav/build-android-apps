[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "play-store-mcp"
version = "0.1.0"
description = "MCP server for Google Play Developer API (upload, listing, review, rollout)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Mitun"}]
requires-python = ">=3.10"
keywords = ["mcp", "android", "play-store", "publishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
play-store-mcp = "play_store_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["play_store_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
