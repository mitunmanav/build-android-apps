interface:
  display_name: "Build Android Apps"
  short_description: "One skill to build, run, debug, and ship — plain English in, routed action out"
  icon_small: "../../assets/build-android-app-small.svg"
  brand_color: "#3DDC84"
  default_prompt: "Use $build-android-apps to make an app from one sentence — it routes to the right specialist"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "adb"
      description: "adb devices, install, logcat, screenshots"
      transport: "stdio"
    - type: "mcp"
      value: "gradlew"
      description: "Gradle builds, tests, lint via the project wrapper"
      transport: "stdio"
