[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystore-mcp"
version = "0.1.0"
description = "MCP server for upload keystore operations (generate, verify, rotate, backup, fingerprint)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Mitun"}]
requires-python = ">=3.10"
keywords = ["mcp", "android", "keystore", "signing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
keystore-mcp = "keystore_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["keystore_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
